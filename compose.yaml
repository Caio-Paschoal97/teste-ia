services:
  mysql:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: pokeidle
      MYSQL_USER: pokeidle
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in server/.env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u pokeidle pokeidle -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
